// =====================================================
// PetrusProject - Size 2 Tanks → Size 2.5 Tanks (1.25x)
// =====================================================

// --- Rockomax X200-8S (Small/Pancake) ---
+PART[Rockomax8_BW]:FINAL // Note the underscore here!
{
    @name = size2p5_Rockomax8
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Rockomax X200-8S Fuel Tank
    @description = Some call it a "pancake tank," we call it "vertically challenged but horizontally gifted." Perfect for 2.5m landers that need a wide base.
    
    @mass *= 1.953125
    @cost *= 1.953125
    @entryCost *= 1.953125
    
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    
    @bulkheadProfiles = size2p5, srf
    
    @RESOURCE[LiquidFuel]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }

    @tags = fueltank lfo liquid oxidizer propellant rocket size2p5
}

