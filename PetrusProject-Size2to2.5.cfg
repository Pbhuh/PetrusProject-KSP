// =====================================================
// PetrusProject - Size 2 Tanks → Size 2.5 Tanks (1.25x)
// =====================================================

@PART[Rockomax8BW]:NEEDS[PetrusProject]:FINAL
{
    @name = size2p5_Rockomax8
    @title = Rockomax X200-8S Fuel Tank
    @description = The popular X200-8, now offered in the more fashionable 2.5m diameter for your Delta-style rockets.
    
    @bulkheadProfiles = size2p5, srf
    @rescaleFactor = 1.25
    
    @mass *= 1.953125
    @cost *= 1.953125
    @entryCost *= 1.953125
    
    @crashTolerance = 8
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    
    @maxTemp = 2100
    @skinMaxTemp = 2500
    
    @tags = fueltank lfo liquid oxidizer propellant rocket
}

