+PART[Rockomax64]:FINAL
{
    @name = size2p5_Rockomax64
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Rockomax Jumbo-64S Fuel Tank
    @description = The legendary Jumbo-64, now in the stylish 2.5 meter diameter. Still not orange flavored, but 25% more substantial.
    
    @mass *= 1.953125
    @cost *= 1.953125
    @entryCost *= 1.953125
    
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    
    @bulkheadProfiles = size2p5, srf
    
    // Scale resources properly
    @RESOURCE[LiquidFuel]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }

    // This handles the Variant scaling issue
    @MODULE[ModulePartVariants]
    {
        @baseVariant = BlackAndWhite
        // We ensure the variant objects don't conflict with the new scale
    }

    @tags = fueltank lfo liquid orange oxidizer propellant rocket size2p5
}