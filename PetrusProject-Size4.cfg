// =====================================================
// PetrusProject - Size 4 Tanks Changes
// =====================================================

@PART[Size4_Tank_02]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
	MODULE
	{
		name = ModulePartVariants
		baseVariant = BlackAndWhite
		VARIANT
		{
			name = BlackAndWhite
			displayName = #autoLOC_8007122
			themeName = BlackAndWhite
			primaryColor = #ffffff
			secondaryColor = #000000
			TEXTURE
			{
				mainTextureURL = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks
				_BumpMap = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks_N
				// Tiling 1, 0.25 (takes 1/4th of the height)
				// Offset 0, 0 (starts at the bottom)
				_MainTex_ST = 1, 0.25, 0, 0
			}
		}
		VARIANT
		{
			name = White
			displayName = #autoLOC_8007119
			themeName = White
			primaryColor = #ffffff
			secondaryColor = #ffffff
			TEXTURE
			{
				mainTextureURL = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks
				_BumpMap = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks_N
				// Tiling 1, 0.25 
				// Offset 0, 0.25 (slides up by one slice)
				_MainTex_ST = 1, 0.25, 0, 0.25
			}
		}
	}
    @tags ^= :$: ProjectPetrus:
}

@PART[Size4_Tank_04]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
	MODULE
	{
		name = ModulePartVariants
		baseVariant = White
		useMultipleDragCubes = false
		VARIANT
		{
			name = White
			displayName = #autoLOC_8007119 // White
			themeName = White
			primaryColor = #ffffff
			secondaryColor = #ffffff
		}
		VARIANT
		{
			name = Orange
			displayName = #autoLOC_8007123 // Orange
			themeName = Orange
			primaryColor = #f49841
			secondaryColor = #4c4f47
			TEXTURE
			{
				// The texture name for the Jumbo 64 Orange foam
				mainTextureURL = Squad/Parts/FuelTank/Size2Lfb/Size2Lfb_Main
				_BumpMap = Squad/Parts/FuelTank/Size2Lfb/Size2Lfb_Norm
				
				// Tiling: 2, 1 means the texture repeats twice around the circumference
				// to keep the detail sharp on the larger Size 4 diameter.
				_MainTex_ST = 2, 1, 0, 0
				
				shader = KSP/Bumped Specular
			}
		}
	}
    @tags ^= :$: ProjectPetrus:
}