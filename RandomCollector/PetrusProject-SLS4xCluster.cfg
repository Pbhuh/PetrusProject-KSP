+PART[Size3EngineCluster]:FINAL
{
    @name = Size4_Mammoth_Engine
    @author = PetrusPB
    @rescaleFactor = 1.333
    
    @title = SLS RS-25Dx4 "Artemis" Liquid Fuel Engine Cluster
    @description = When Kerbodyne engineers realized that the 3.75m Mammoth was "cute but insufficient," they simply enlarged the assembly to fit the new 5m standard. It's the same engine you love, just bigger, louder, and significantly more expensive.
    
    @TechRequired = veryHeavyRocketry
    @entryCost = 115000
    @cost = 39000
    @category = Engine
    
    @mass = 15
    @breakingForce = 400
    @breakingTorque = 400
    @crashTolerance = 20
    
    @bulkheadProfiles = size4

    @MODULE[ModuleEnginesFX]
    {
        @maxThrust = 5000
        @heatProduction = 192
        
        @atmosphereCurve
        {
            @key = 0 315
            @key = 1 295
            @key = 12 0.001
        }
    }

    @MODULE[ModuleGimbal]
    {
        @gimbalRange = 2
    }

    @MODULE[ModuleAlternator]
    {
        @RESOURCE[ElectricCharge]
        {
            @rate = 12.0
        }
    }

    // This inherits all the EFFECTS (exhaust, sound) from the original
    // without needing to copy the hundreds of lines of FX code.
    
    @tags = mammoth sls size4 cluster rocket engine propuls
}