// === Size 5 Engine Cluster Adapter ===
+PART[Size4_EngineAdapter_01]:FINAL
{
    @name = Size5_EngineAdapter_01
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Kerbodyne S5 Engine Cluster Adapter Tank
    @description = When even the S5 tanks proved too much for a single engine, Kerbodyne engineers once again solved the problem by bolting five (or more) engines underneath this even larger adapter.
    
    @entryCost *= 1.953125
    @cost *= 1.953125
    @mass *= 1.953125
    
    @crashTolerance = 12
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    
    @bulkheadProfiles = size5, size1, srf
    
    // Scale resources
    @RESOURCE[LiquidFuel]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    
    @tags = fueltank adapter enginecluster lfo size5
}


// === Size 5 Nose Cone ===
+PART[rocketNoseConeSize4]:FINAL
{
    @name = rocketNoseConeSize5
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Protective Nose Cone Mk16B
    @description = An even more immense nosecone for the truly heroic 6.25m rocket stacks. Now with 25% more dignity.
    
    @entryCost *= 1.953125
    @cost *= 1.953125
    @mass *= 1.953125
    
    @crashTolerance = 12
    @maxTemp = 2600
    @bulkheadProfiles = size5
    
    @tags = aero nose cone cap size5
}


// === Size 5 Fairing ===
+PART[fairingSize4]:FINAL
{
    @name = fairingSize5
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = AE-FF6 Airstream Protective Shell (6.25m)
    @description = FLOOYD Dynamics proudly presents the even larger AE-FF6. Because sometimes you need to protect really big dreams.
    
    @entryCost *= 1.953125
    @cost *= 1.953125
    @mass *= 1.953125
    
    @bulkheadProfiles = size5
    
    // Important: Scale the procedural fairing values
    @MODULE[ModuleProceduralFairing]
    {
        @baseRadius *= 1.25
        @maxRadius *= 1.25
        @capRadius *= 1.25
    }
    
    @tags = aero fairing payload size5
}