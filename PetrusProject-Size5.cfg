// =====================================================
// PetrusProject - Size 4 Tanks → Size 5 Tanks (1.25x)
// =====================================================

+PART[Size4_Tank_01]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = Size5_Tank_01
	@author = PetrusPB
	@rescaleFactor = 1.25
    @entryCost *= 1.953125
    @cost *= 1.953125
    @title = Kerbodyne S5-125 Fuel Tank
	//@manufacturer = #autoLOC_501638   //#autoLOC_501638 = Kerbodyne
    @description = The S5 Fuel Tank series was born when Wernher von Kerman demanded a single tank large enough to fly an entire Mun base in one go. This was, of course, years before anyone had invented the docking port. After the project was quietly cancelled, these gigantic rusty behemoths were repurposed by local Kerbals as excellent rainwater collectors and emergency swimming pools.
    @mass *= 1.953125
    // Better thermal values
    //@maxTemp = 2200
    //@skinMaxTemp = 2700
    @bulkheadProfiles = size5, srf    
    @crashTolerance = 13
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625    
        
    // Scale resources
    @RESOURCE[LiquidFuel]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    
    @tags = fueltank lfo liquid oxidizer propellant rocket size5
}

