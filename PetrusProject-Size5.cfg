// === Size 5 Engine Cluster Adapter ===

+PART[Size4_EngineAdapter_01]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = Size5_EngineAdapter_01
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Saturn Engine Cluster - S5 Edition
    @description = All the fun of the original cluster adapter, now 25% bigger so you can fit even more boosters where they probably don't belong.

    @mass = 5.625
    @cost = 9000
    @entryCost = 36000
    @bulkheadProfiles = size5, size1, srf

    @RESOURCE[LiquidFuel]
    {
        @amount = 7911
        @maxAmount = 7911
    }
    @RESOURCE[Oxidizer]
    {
        @amount = 9669
        @maxAmount = 9669
    }

    MODULE
    {
        name = HelloKerbinMod
    }
}

// === Size 5 Nose Cone ===
+PART[rocketNoseConeSize4]:FINAL
{
    @name = Size5_NoseCone_01
    @rescaleFactor = 1.25
    @title = Protective Nose Cone Mk5
    @description = Our scientists discovered that by scaling up the Mk4, it doesn't just cut through the air better; it actually intimidates the air into moving out of the way.
    @mass *= 1.953125
    @cost *= 1.953125
    @entryCost *= 1.953125
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    @bulkheadProfiles = size5
}

// --- Size 5 Procedural Fairing ---
+PART[fairingSize4]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = Size5_Fairing_01
    @rescaleFactor = 1.25
    @title = AE-FF5 Fairing Base (6.25m)
    @description = When you need to protect a payload the size of a small apartment complex. Warning: Do not deploy while Kerbals are performing exterior maintenance.
    @mass *= 1.953125
    @cost *= 1.953125
    @entryCost *= 1.953125
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    @bulkheadProfiles = size5

    @MODULE[ModuleProceduralFairing]
    {
        @baseRadius *= 1.25
        @maxRadius *= 1.25
        @snapThreshold *= 1.25
    }
}