// === Size 5 Engine Cluster Adapter ===

+PART[Size4_EngineAdapter_01]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = Size5_EngineAdapter_01
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Kerbodyne S5x5 Engine Cluster Adapter Tank
    @description = All the fun of the original cluster adapter, now 25% bigger so you can fit even more boosters where they probably don't belong.

    @mass = 5.625
    @cost = 9000
    @entryCost = 36000
    @bulkheadProfiles = size5, size1, srf

    @RESOURCE[LiquidFuel]
    {
        @amount = 7911
        @maxAmount = 7911
    }
    @RESOURCE[Oxidizer]
    {
        @amount = 9669
        @maxAmount = 9669
    }

    MODULE
    {
        name = HelloKerbinMod
    }
}
// --- TD-62 Decoupler (Rescaled from TD-50) ---
+PART[Decoupler_4]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = Size5_Decoupler_01_BROKE
    @author = RoverDude (Remix by PetrusPB)
    @rescaleFactor = 1.25
    
    @title = TD-62 Decoupler
    @description = When the TD-50 just wasn't enough to handle the sheer "oomph" of your 6.25m booster stages, O.M.B. Demolition Enterprises delivered this. Handle with care, or at least from a safe distance.
    
    // Mass and Cost scaling (Volume based: 1.25^3 = 1.953125)
    @mass *= 1.953125
    @cost *= 1.953125
    @entryCost *= 1.953125
    
    // Strength scaling (Area based: 1.25^2 = 1.5625)
    @breakingForce *= 1.5625
    @breakingTorque *= 1.5625
    
    @bulkheadProfiles = size5
    
    @MODULE[ModuleDecouple]
    {
        @ejectionForce *= 1.5625 // Giving it more kick for the heavier stages
    }
}

