PART
{
    name = SLSEngineCluster_4X // Unique internal name
    module = Part
    author = PetrusPB

    MODEL
    {
        model = PetrusProject2/Parts/SLSEngineCluster/SLSEngineCluster // No .mu extension
    
		// Map the internal mesh texture names to the actual files
		texture = four_nozzle_engine_cm , Squad/Parts/Engine/Size3EngineCluster/four_nozzle_engine_cm
		texture = four_nozzle_engine_nm , Squad/Parts/Engine/Size3EngineCluster/four_nozzle_engine_nm
		texture = ClusterEngineEmit , Squad/Parts/Engine/Size3EngineCluster/ClusterEngineEmit
    }
    rescaleFactor = 1.333

    // --- Node Definitions ---
    // You must ensure these match where your Blender nodes/empties are
    // --- Standard Top/Bottom Nodes ---
	
	node_stack_top = 0.0, 1.527, 0.0, 0.0, 1.0, 0.0, 4
	//node_stack_bottom = 0.0, -1.3, 0.0, 0.0, -1.0, 0.0, 4 // Central node
	
	// --- The 4 Engine Cluster Nodes ---
	// These are arranged in a square pattern to fit 4 S-25s
	node_stack_A = -0.78, -1.45,  1.37, 0.0, -1.0, 0.0, 3
    node_stack_B =  0.78, -1.45,  1.37, 0.0, -1.0, 0.0, 3
    node_stack_C = -0.78, -1.45, -1.37, 0.0, -1.0, 0.0, 3
    node_stack_D =  0.78, -1.45, -1.37, 0.0, -1.0, 0.0, 3
	
	// This allows you to place one engine and have it mirror to the other 3
	stackSymmetry = 3

    // --- Attachment Rules ---
    // 1=stack, 1=srfAttach, 1=allowStack, 1=allowSrfAttach, 0=allowCollision
    attachRules = 1,0,1,1,0

    TechRequired = veryHeavyRocketry
    entryCost = 25000
    cost = 32000
    category = FuelTank // Or Engine if it still has thrust
    title = SLS Engine Mount 4X
    manufacturer = Kerbodyne
    description = We've hollowed out a Mammoth to give you more room for activities. Specifically, bolting S-25 engines to it.
    
    mass = 5.0
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.3
    angularDrag = 2
    crashTolerance = 20
    breakingForce = 400
    breakingTorque = 400
    maxTemp = 2400
    bulkheadProfiles = size4
	
	// --- Resources ---
    RESOURCE
    {
        name = LiquidFuel
        amount = 5760
        maxAmount = 5760
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 7040
        maxAmount = 7040
    }
}