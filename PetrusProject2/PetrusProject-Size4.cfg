// =========================================================================
// Project Petrus - Size 4 Cloned Test Tanks via ModuleManager Override
// =========================================================================

// Part 1: Clone and isolate the Size 4 Medium Tank
+PART[Size4_Tank_02]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = petrus_size4_tank_02_test
    @title = Kerbodyne S4-3200 Cloned Test Fuel Tank
    @description = A cloned test variant of the standard 5.0m medium propellant tank. Fully isolated via custom naming to enforce dedicated structural shell textures and atlas mapping.

    // Force-inject or completely overwrite the variant module structure safely
    %MODULE[ModulePartVariants]
    {
        %baseVariant = BlackAndWhite
        
        VARIANT
        {
            name = BlackAndWhite
            displayName = #autoLOC_8007122
            themeName = BlackAndWhite
            primaryColor = #ffffff
            secondaryColor = #000000
            TEXTURE
            {
                mainTextureURL = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks
                _BumpMap = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks_N
                // Tiling 1, 0.25 (takes 1/4th of the height)
                // Offset 0, 0 (starts at the bottom)
                _MainTex_ST = 1, 0.25, 0, 0
            }
        }
        VARIANT
        {
            name = White
            displayName = #autoLOC_8007119
            themeName = White
            primaryColor = #ffffff
            secondaryColor = #ffffff
            TEXTURE
            {
                mainTextureURL = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks
                _BumpMap = SquadExpansion/MakingHistory/Parts/FuelTank/Assets/Size4_Tanks_N
                // Tiling 1, 0.25 
                // Offset 0, 0.25 (slides up by one slice)
                _MainTex_ST = 1, 0.25, 0, 0.25
            }
        }
    }
    @tags ^= :$: ProjectPetrus:
}

// -------------------------------------------------------------------------

// Part 2: Clone and isolate the Size 4 Massive Tank
+PART[Size4_Tank_04]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
    @name = petrus_size4_tank_04_test
    @title = Kerbodyne S4-14400 Cloned Test Fuel Tank
    @description = A cloned 5.0m heavy lift test core. Isolated from stock system configurations to cleanly handle custom multi-texture UV remapping profiles.

    // Force-inject or completely overwrite the variant module structure safely
    %MODULE[ModulePartVariants]
    {
        %baseVariant = White
        %useMultipleDragCubes = false
        
        VARIANT
        {
            name = White
            displayName = #autoLOC_8007119 // White
            themeName = White
            primaryColor = #ffffff
            secondaryColor = #ffffff
        }
        VARIANT
        {
            name = Orange
            displayName = #autoLOC_8007123 // Orange
            themeName = Orange
            primaryColor = #f49841
            secondaryColor = #4c4f47
            TEXTURE
            {
                // The texture name for the Jumbo 64 Orange foam
                mainTextureURL = Squad/Parts/FuelTank/Size2Lfb/Size2Lfb_Main
                _BumpMap = Squad/Parts/FuelTank/Size2Lfb/Size2Lfb_Norm
                
                // Tiling: 2, 1 means the texture repeats twice around the circumference
                // to keep the detail sharp on the larger Size 4 diameter.
                _MainTex_ST = 2, 1, 0, 0
                
                shader = KSP/Bumped Specular
            }
        }
    }
    @tags ^= :$: ProjectPetrus:
}