// =====================================================
// PetrusProject - Early Liquid Fuel Engine
// =====================================================

+PART[liquidEngine_v2]:FINAL
{
    @name = petrus_a4_alcohol_engine
    @author = PetrusPB

    @title = LV-4 "Whiskey" Liquid Fuel Engine
    @manufacturer = Peenemunde Army Research Center
    @description = A primitive engine burning whiskey and liquid oxygen. It does sadly lack gimbaling. External stabilizing fins or exhaust jet vanes are required for flight control. Do not breath in the exhaust gases as it may lead to dizzyness.
    @category = Engine
    @subcategory = 0
    @TechRequired = start

    @mass = 0.55

    @MODULE[ModuleEngines*]
    {
        @maxThrust = 75
        @minThrust = 75 
        
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 239   
            key = 1 205   
            key = 3 0.001
        }
    }

    !MODULE[ModuleGimbal] {}

    @tags = engine propulsion liquid a4 v2 alcohol ethanol
}