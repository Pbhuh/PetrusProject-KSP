PART
{
	name = FL-HugeFlatAdapter
    module = Part
    author = PetrusPB
    
    MODEL
    {
        model = PetrusProject2/Parts/FL-Adapter/Assets/FL-FlatAdapter
    }
    rescaleFactor = 5

    // --- Adjusted Nodes for Size 2 Scale ---
    // x, y, z, angX, angY, angZ, size
    node_stack_top = 0.0, 0.1345, 0.0, 0.0, 1.0, 0.0, 4
    node_stack_bottom = 0.0, -0.165, 0.0, 0.0, -1.0, 0.0, 5
    
    TechRequired = advConstruction
    entryCost = 12000
    cost = 1200
    category = Structural
    subcategory = 0
    title = FL-1000 Size Adapter
    manufacturer = Jebediah Kerman's Junkyard and Spacecraft Parts Co
    description = A scaled-up version of the classic FL adapter, now beefy enough to handle 2.5m stacks without wobbling like a jelly salad.
    
    attachRules = 1,0,1,1,0
    
    // Increased mass for the larger size
    mass = 0.3
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
	// Joint strength needs to be MUCH higher for 2.5m stacks
    breakingForce = 200
    breakingTorque = 200
    crashTolerance = 12
    maxTemp = 2000
    fuelCrossFeed = True
    bulkheadProfiles = size4, size5
	
	MODULE
    {
        name = ModulePartVariants
        baseVariant = White
		useMultipleDragCubes = false
        VARIANT
        {
            name = White
            displayName = #autoLOC_8007119
            themeName = White
            primaryColor = #ffffff
        }
        VARIANT
        {
            name = Orange
            displayName = #autoLOC_8007123
            themeName = Orange
            primaryColor = #f49841
            secondaryColor = #4c4f47
            TEXTURE
            {
                mainTextureURL = Squad/Parts/Structural/FLAdapters/Assets/FLA-Adapters_diffuse_O
                _BumpMap = Squad/Parts/Structural/FLAdapters/Assets/FLA-Adapters_normal_O
            }
        }
    }
}
