// Project Petrus - Custom 2.5m to 3.125m Fuel Tank Adapter from Custom Base
+PART[S4S5AdapterTank]:FOLLOWER[Petrus]
{
    @name = MatchingSize2to2p5Adapter
    @module = Part
    @author = PetrusPB
    
    // Physical Attributes
    @title = KSC-Delta S2.5-S3 Adapter Tank
    @description = A perfectly downscaled version of our massive S4-S5 adapter, re-engineered to transition columns from a Size 2 (2.5m) base down to a Size 2.5 (3.125m) stack.
    @category = FuelTank
    @subcategory = 0
    @mass *= 0.125
    
    // Crucial Scale Correction
    @rescaleFactor = 0.5
	@node_stack_top = 0.0, 1.25, 0.0, 0.0, 1.0, 0.0, 2
	@node_stack_bottom = 0.0, -1.25, 0.0, 0.0, -1.0, 0.0, 3
	@node_attach = 1.25, -0.625, 0.0, 1.0, 0.0, 0.0, 1
    
    // Scale resources
    @RESOURCE[LiquidFuel]
    {
        @amount *= 0.125
        @maxAmount *= 0.125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 0.125
        @maxAmount *= 0.125
    }
}