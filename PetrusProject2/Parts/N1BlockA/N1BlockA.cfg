//Test Decoupler Stage

PART
{
    name = petrus_n1_interstage_ab
    module = Part
    author = PetrusPB

    MODEL
    {
        // Utilizing the stock Size 4 to 5 structural adapter mesh to form the lattice line
        //model = Squad/Parts/Coupling/Assets/StructuralAdapter4-5		
        model = PetrusProject2/Parts/N1BlockA/Assets/Size3_Size4_Adapter_01
    }
    rescaleFactor = 2.0

    // Node setup to snap perfectly onto Block A's upper rim
    node_stack_bottom = 0.0, -0.5, 0.0, 0.0, -1.0, 0.0, 5
    node_stack_top = 0.0, 0.5, 0.0, 0.0, 1.0, 0.0, 5

    attachRules = 1,0,1,1,0

    techRequired = heavyRocketry
    entryCost = 25000
    cost = 3800
    category = Coupling
    subcategory = 0
    title = N1 Block A-B Open-Lattice Interstage Decoupler
    manufacturer = OKB-1 Petrus Design Bureau
    description = A heavy structural framework adapter featuring an open lattice configuration. This design allows the massive engine cluster of the upcoming Block B stage to ignite safely while still attached, venting its high-pressure exhaust directly through the truss walls before final separation.
    
    mass = 2.5
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 30
    maxTemp = 2600
    
    bulkheadProfiles = size5

    fx_gasBurst_white = 0.0, 0.5, 0.0, 0.0, 1.0, 0.0, decouple
    sound_decouple = decouple

    // THE SEPARATION MECHANISM (Isolated on its own physical part)
    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 800
        isExplosive = true
        explosiveNodeID = top
        staged = true
    }
}