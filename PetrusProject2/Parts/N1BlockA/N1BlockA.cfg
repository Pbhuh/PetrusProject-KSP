PART
{
    name = petrus_n1_block_a
    module = Part
    author = PetrusPB

    MODEL
    {
        //model = PetrusProject2/Parts/N1BlockA/Assets/N1BlockA
        model = PetrusProject2/Parts/N1BlockA/Assets/S4S5AdapterTank2
    }
    //rescaleFactor = 1.0
    rescaleFactor = 2.0
    
    // Node Definitions (Adjusted to sit flush on the actual rescaled adapter rims)
    // Bottom node at the engine base plane
    node_stack_bottom = 0.0, -2.35, 0.0, 0.0, -1.0, 0.0, 5
    // Top node sitting perfectly on the upper lattice rim facing upward
    node_stack_top = 0.0, 2.35, 0.0, 0.0, 1.0, 0.0, 5
    
    // Grants explicit structure assembly permissions to the VAB compiler
    attachRules = 1,1,1,1,0

    // FIXED: Wrapped throttle illumination inside a legitimate stock module block
    MODULE
    {
        name = FXModuleAnimateThrottle
        animationName = N1_Thrust_Glow
        dependOnEngineState = True
        responseSpeed = 0.5
    }

    sound_vent_medium = decouple
    sound_rocket_hard = launch
    sound_vent_soft = deactivate

    techRequired = heavyRocketry
    entryCost = 145000
    cost = 68000
    category = Engine
    subcategory = 0
    title = L3-Block A "KORD" Integrated First Stage Booster
    manufacturer = OKB-1 Petrus Design Bureau
    description = A colossal, single-piece conical launcher stage. Integrates 30 un-gimbaled primary powerheads, internal fuel tanks, and an upper structural open-lattice hot-stage shroud. Pitch and yaw are handled by a highly constrained differential exhaust matrix, while roll control must be provided via auxiliary external systems.
    
    // Solid structural mass to handle heavy compression loads
    mass = 31.5
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.3
    angularDrag = 2
    crashTolerance = 20
    maxTemp = 2400
    
    // High tolerances to prevent the Size 5 connection point from snapping
    breakingForce = 9000
    breakingTorque = 9000
    
    bulkheadProfiles = size5, conical

    // PROPELLANT STORAGE (Strict 9:11 Volumetric Ratio)
    RESOURCE
    {
        name = LiquidFuel
        amount = 26640
        maxAmount = 26640
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 32560
        maxAmount = 32560
    }

    // OVERHAULED PROPULSION SYSTEM (With Physics Obstruction Bypasses)
    MODULE
    {
        name = ModuleEnginesFX
        thrustVectorTransformName = thrustTransform
        
        // CRITICAL FIXES: Stops the engine from raycasting and choking on its own structural colliders
        exhaustDamage = False
        %overrideTransformName = True    // Forces KSP to fall back to the base part origin if the model lacks an internal transform hierarchy
        
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 11500
        heatProduction = 340
        
        // Pushes the physical thrust forces 4.5 meters straight down, clearing the bottom collider rim completely
        fxOffset = 0, 0, 4.5
        
        EngineType = LiquidFuel
        
        PROPELLANT
        {
            name = LiquidFuel
            ratio = 0.9
            DrawGauge = True
        }
        PROPELLANT
        {
            name = Oxidizer
            ratio = 1.1
        }
        atmosphereCurve
        {
            key = 0 330
            key = 1 297
            key = 3 0.001
        }
    }

    // SIMULATED DIFFERENTIAL THROTTLING (Tight 1-degree control arc)
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = thrustTransform
        gimbalRange = 1.0
        gimbalResponseSpeed = 12
        useGimbalResponseSpeed = true
    }

	// INTEGRATED HOT-STAGE DECOUPLING SYSTEM (Forced Separate Staging)
    //MODULE
    //{
    //    name = ModuleDecouple
    //    ejectionForce = 600
    //    isExplosive = true
    //    explosiveNodeID = top
    //    
    //    staged = true
    //    stageOffset = 1       
    //    childStageOffset = 1  
    //    
    //    // THE CRITICAL FIXES: Forces the engine wrapper to release its grip on this staging event
    //    stagingToggle = true
    //    stagingEnabled = true
    //    stagingGroup = DECOUPLE
    //}
    MODULE
    {
        name = ModuleSurfaceFX
        thrustProviderIndex = 0
        fxMax = 1.2
        maxDistance = 100
        falloff = 2.0
        thrustTransformName = thrustTransform
    }

    tags = n1 blocka soviet engine fuel tank cluster heavy l3 petrus
}

PART
{
    name = petrus_n1_interstage_ab
    module = Part
    author = PetrusPB

    MODEL
    {
        // Utilizing the stock Size 4 to 5 structural adapter mesh to form the lattice line
        //model = Squad/Parts/Coupling/Assets/StructuralAdapter4-5		
        model = PetrusProject2/Parts/N1BlockA/Assets/Size3_Size4_Adapter_01
    }
    rescaleFactor = 2.0

    // Node setup to snap perfectly onto Block A's upper rim
    node_stack_bottom = 0.0, -0.5, 0.0, 0.0, -1.0, 0.0, 5
    node_stack_top = 0.0, 0.5, 0.0, 0.0, 1.0, 0.0, 5

    attachRules = 1,0,1,1,0

    techRequired = heavyRocketry
    entryCost = 25000
    cost = 3800
    category = Coupling
    subcategory = 0
    title = N1 Block A-B Open-Lattice Interstage Decoupler
    manufacturer = OKB-1 Petrus Design Bureau
    description = A heavy structural framework adapter featuring an open lattice configuration. This design allows the massive engine cluster of the upcoming Block B stage to ignite safely while still attached, venting its high-pressure exhaust directly through the truss walls before final separation.
    
    mass = 2.5
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 30
    maxTemp = 2600
    
    bulkheadProfiles = size5

    fx_gasBurst_white = 0.0, 0.5, 0.0, 0.0, 1.0, 0.0, decouple
    sound_decouple = decouple

    // THE SEPARATION MECHANISM (Isolated on its own physical part)
    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 800
        isExplosive = true
        explosiveNodeID = top
        staged = true
    }
}