//Salyut Style Parts both kitbashed, new models, rescaled and more

// Project Petrus - Size 1.5 Salyut Crew Module 
+PART[crewCabin]:FOLLOWER[Petrus]
{
    @name = petrus_salyut_crew_cabin
    @author = PetrusPB

    @title = DOS-B "Hearth" Crew Habitation Module
    @description = A ruggedized variant of the standard habitation capsule. Compressed only in diameter to a uniform Size 1.5 (1.875m) profile while maintaining its original length, it serves as the primary structural hull for modular orbital space stations.
    @category = Utility

    !mesh = DELETE

    MODEL
    {
        model = Squad/Parts/Utility/crewCabin/model
        scale = 0.75, 1.0, 0.75
    }
    
    %rescaleFactor = 1.0

    @node_stack_top = 0.0, 1.10782, 0.0, 0.0, 1.0, 0.0, 2
    @node_stack_bottom = 0.0, -1.10782, 0.0, 0.0, -1.0, 0.0, 2
}

// Project Petrus - Custom Salyut/Almaz Structural Transition Core
+PART[Size3_Size4_Adapter_01]:FOLLOWER[Petrus]
{
    @name = petrus_salyut_taper_adapter
    @module = Part
    @author = PetrusPB
    
    // Physical Attributes
    @title = DOS-A "Vanguard" Structural Taper Module
    @description = An aggressively sloped, short transitional adapter designed to bridge 2.5m structural segments down to a 1.875m profile. Stripped of all heavy rocket propellants, this hollow core houses intermediate reaction wheels and the station's primary data logging mainframes.
    @category = Science
    @subcategory = 0
    @mass = 0.25 // Significantly lightened by stripping out fuel tanks
    
    // Crucial Scale Correction
    %rescaleFactor = 0.5
    
    // Corrected Node Snapping Profiles (Both use Size 2 node logic for structural stiffness)
    @node_stack_top = 0.0, 0.575, 0.0, 0.0, 1.0, 0.0, 2
    @node_stack_bottom = 0.0, -0.575, 0.0, 0.0, -1.0, 0.0, 2
    
    // Purge the original fuel resource modules completely
    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Oxidizer] {}
    
    // Inject Station Utilities
    RESOURCE
    {
        name = ElectricCharge
        amount = 500
        maxAmount = 500
    }
    
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 15
        YawTorque = 15
        RollTorque = 15
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.4
        }
    }

    MODULE
    {
        name = ModuleScienceLab
        containerModuleIndex = 0
        dataStorage = 500
        crewsRequired = 0 // Data sits here safely; scientists process it from the Hitchhiker
    }
    
    // Visual variant override to blend with Soviet styling
    MODULE
    {
        name = ModulePartVariants
        baseVariant = White
        VARIANT
        {
            name = White
            displayName = Clean White Shell
            themeName = White
            primaryColor = #ffffff
            secondaryColor = #ffffff
            TEXTURES
            {
                // Swaps the checkered SLS texture for a uniform clean white sheet
                _MainTex = Squad/Parts/Engine/Size4EngineAdapter/Size4Adapter_diffuse_white
            }
        }
    }
}