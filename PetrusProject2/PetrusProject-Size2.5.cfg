+PART[Rockomax64_BW]:FINAL
{
    @name = size2p5_Rockomax80
    @author = PetrusPB    
    @title = KSC-Delta Superjumbo-80 Fuel Tank
	@manufacturer = KSC-Delta Aerospace
    @description = Fixed the "shimmering" issue. The engineers finally figured out how to paint it without both colors showing up at once.
    
    @bulkheadProfiles = size2p5, srf
    @rescaleFactor = 1.25
    @mass *= 1.953125
    @cost *= 1.953125

    @RESOURCE[LiquidFuel]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }

    // --- REPAIRING THE VISUALS ---
    !MODULE[ModulePartVariants] {} // Delete the old, broken module

    MODULE
    {
        name = ModulePartVariants
        baseVariant = BlackAndWhite
        
        VARIANT
        {
            name = BlackAndWhite
            displayName = #autoLOC_8007122
            themeName = White
            primaryColor = #ffffff
            secondaryColor = #000000
            GAMEOBJECTS
            {
                Rockomax_64_White = true   // Only show White
                Rockomax_64_Orange = false // Hide Orange
            }
        }
        VARIANT
        {
            name = Orange
            displayName = #autoLOC_8007123
            themeName = Orange
            primaryColor = #f49841
            secondaryColor = #4c4f47
            GAMEOBJECTS
            {
                Rockomax_64_White = false // Hide White
                Rockomax_64_Orange = true  // Only show Orange
            }
            // Re-adding the texture links for the Orange variant
            TEXTURE
            {
                mainTextureURL = Squad/Parts/FuelTank/RockomaxTanks/Assets/rockomax_16 [AlbedoM] O
                _BumpMap = Squad/Parts/FuelTank/RockomaxTanks/Assets/rockomax_16 [Normal]O
            }
        }
    }
    @tags ^= :$: ProjectPetrus:
}

