// =====================================================
// PetrusProject - Size 3 Tanks → Size 2.5 Tanks (0.6667x)
// =====================================================

+PART[Size3SmallTank]:FINAL
{
    @name = size2p5_S3SmallTank
    @title = Kerbodyne S2.5-1800 Tank
    @description = A downsized S3 tank for 2.5m rockets. Because not every rocket needs to be a skyscraper.
    
    @bulkheadProfiles = size2, srf
    @rescaleFactor = 0.6667
    
    @mass *= 0.2963
    @cost *= 0.2963
    @entryCost *= 0.2963
    
    @crashTolerance = 7
    @breakingForce *= 0.4444
    @breakingTorque *= 0.4444
    
    @maxTemp = 2050
    @skinMaxTemp = 2450

    // Force-wipe stock resources and define clean integer volumes
    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Oxidizer] {}

    RESOURCE
    {
        name = LiquidFuel
        amount = 810   // Clean integer balance for a 2.5m small tank
        maxAmount = 810
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 990
        maxAmount = 990
    }
    
    @tags = fueltank lfo liquid oxidizer propellant rocket petrus
}

