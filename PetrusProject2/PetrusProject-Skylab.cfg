+PART[Rockomax8BW]:FINAL
{
    @name = size2p5_Rockomax10
    @author = PetrusPB
    @rescaleFactor = 1.25
    
    @title = Rockomax X250-10 Fuel Tank
    @description = Because sometimes you need more fuel, but not quite "Size 3 ridiculous" levels.
    
    @mass *= 1.953125
    @cost *= 1.953125
    @bulkheadProfiles = size2p5, srf

    @RESOURCE[LiquidFuel]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 1.953125
        @maxAmount *= 1.953125
    }

    // --- REPAIRING THE VISUALS ---
    !MODULE[ModulePartVariants] {} // Delete the old, broken module
    
	MODULE
	{
		name = ModulePartVariants
		baseVariant = BlackAndWhite
		VARIANT
		{
			name = BlackAndWhite
			displayName = #autoLOC_8007122
			themeName = White
			primaryColor = #ffffff
			secondaryColor = #000000
			GAMEOBJECTS
			{
				Rockomax_8_White = true
				Rockomax_8_Orange = false
			}
		}
		VARIANT
		{
			name = Orange
			displayName = #autoLOC_8007123
			themeName = Orange
			primaryColor = #f49841
			secondaryColor = #4c4f47
			GAMEOBJECTS
			{
				Rockomax_8_White = false
				Rockomax_8_Orange = true
			}
			TEXTURE
			{
				mainTextureURL = Squad/Parts/FuelTank/RockomaxTanks/Assets/rockomax_16 [AlbedoM] O
				_BumpMap = Squad/Parts/FuelTank/RockomaxTanks/Assets/rockomax_16 [Normal]O
			}
		}
	}
    @tags ^= :$: ProjectPetrus:
}

