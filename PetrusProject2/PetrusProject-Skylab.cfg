// =====================================================
// PetrusProject - Skylab Size3 Science Laboratory and Orbital Crew Module
// =====================================================

// Clone the stock Kerbodyne S3-7200 tank into a self-contained habitat
+PART[Size3LargeTank]:FOLLOWER[Petrus]
{
    @name = petrus_skylab_workshop
    @module = Part
    @author = PetrusPB

    // Physical and Categorical Overrides
    @title = OWS-1 "Skylab" Orbital Workshop
    @manufacturer = Kerbodyne
    @description = Built from the hollowed-out hull of a massive 3.75m upper rocket stage, this cavernous monolith serves as the ultimate long-duration orbital outpost. Stripped of all propellant plumbing, it features immense living quarters for up to six Kerbals and a high-yield super-laboratory capable of fast-tracking data analysis.
    @category = Science
    @subcategory = 0
    @mass = 4.5 // Rebalanced dry mass for heavy internal laboratory equipment and crew sub-floors
    
    // Living Quarters Logic
    %CrewCapacity = 6

    // Purge original fuel resources
    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Oxidizer] {}

    // Inject heavy station battery bank
    RESOURCE
    {
        name = ElectricCharge
        amount = 1500
        maxAmount = 1500
    }

    // Core Science Storage Logic (Ported from Mobile Processing Lab)
    %MODULE[ModuleScienceLab]
    {
        containerModuleIndex = 0
        dataStorage = 750 // Expanded storage capacity to reflect its immense physical volume
        crewsRequired = 1
        canResetConnectedModules = True
        canResetNearbyModules = True
    }

    // High-Yield Science Processing Logic (Ported from Mobile Processing Lab)
    %MODULE[ModuleScienceConverter]
    {
        dataProcessingMultiplier = 0.5 // 50% data efficiency bonus
        researchTimeMultiplier = 0.9    // 10% faster research speed due to large facilities
        scienceMultiplier = 5          // Standard high-value science translation multiplier
        scientistsBonus = 0.25         // Bonus scaling per high-level scientist assigned
        requiresCrew = True            // Requires active scientists on board to function
        energyCost = 15.0              // Draws a heavy 15 EC/sec continuous electrical load
        
        RESOURCE_PROCESS
        {
            name = ElectricCharge
            rate = 15.0
        }
    }

    // Interactive Experience Modules
    %MODULE[ModuleScienceContainer]
    {
        reviewActionName = #autoLOC_502201 // Review Data
        storeActionName = #autoLOC_502202  // Store Experiments
        collectActionName = #autoLOC_238018 // Take Data
        evaOnlyStorage = True
        storageRange = 2.0
        allowRepeatedSubjects = True
    }

    %MODULE[ModuleExperienceManagement]
    {
        costToLevelUp = 0
    }

    // Internal Spaces Override
    // References the standard hitchhiker interior mesh so your crew has a home 3D model inside
    INTERNAL
    {
        name = CrewCabinInterior
    }
}