// =====================================================
// PetrusProject - Skylab Size3 Science Laboratory and Orbital Crew Module
// =====================================================

// Clone the stock Kerbodyne S3-7200 tank into a self-contained habitat
+PART[Size3LargeTank]:FOLLOWER[Petrus]
{
    @name = petrus_skylab_workshop
    @author = PetrusPB

    @title = OWS-1 "Skylab" Orbital Workshop
    @manufacturer = KSC-Delta Aerospace
    @description = Built from the hollowed-out hull of a massive 3.75m upper rocket stage, this cavernous monolith serves as the ultimate long-duration orbital outpost. Stripped of all propellant plumbing, it features immense living quarters for up to six Kerbals and a high-yield super-laboratory capable of fast-tracking data analysis.
    @category = Science
    @subcategory = 0
    @mass = 4.5
    
    %CrewCapacity = 6

    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Oxidizer] {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 1500
        maxAmount = 1500
    }

    %MODULE[ModuleScienceLab]
    {
        containerModuleIndex = 0
        dataStorage = 750
        crewsRequired = 2
        canResetConnectedModules = True
        canResetNearbyModules = True
        interactionRange = 5
        SurfaceBonus = 0.1
        ContextBonus = 0.25
        homeworldMultiplier = 0.1
        RESOURCE_PROCESS
        {
            name = ElectricCharge
            amount = 10
        }
    }

    %MODULE[ModuleScienceConverter]
    {
        dataProcessingMultiplier = 0.5
        researchTime = 7
        scienceMultiplier = 5
        scienceCap = 500
        powerRequirement = 5
        ConverterName = #autoLOC_502055
        StartActionName = #autoLOC_502056
        StopActionName = #autoLOC_502057
    }

    %MODULE[ModuleScienceContainer]
    {
        reviewActionName = #autoLOC_502204
        storeActionName = #autoLOC_502202
        collectActionName = #autoLOC_238018
        evaOnlyStorage = True
        storageRange = 2.0
        allowRepeatedSubjects = True
    }

    %MODULE[ModuleExperienceManagement]
    {
        costPerKerbal = 0
    }

    %MODULE[ModuleInventoryPart]
    {
        InventorySlots = 24
        packedVolumeLimit = 2000
    }

    @node_stack_top = 0.0, 3.84, 0.0, 0.0, 1.0, 0.0, 3
    @node_stack_bottom = 0.0, -3.84, 0.0, 0.0, -1.0, 0.0, 3

    @MODULE[ModulePartVariants]
    {
        @baseVariant = White
    }

    INTERNAL
    {
        name = MobileProcessingLabInterior
    }
}