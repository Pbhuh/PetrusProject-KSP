//Bunch of Adapters not Size 2.5 or 5

// Project Petrus - Custom 1.875m to 1.25m Fuel Tank Adapter
+PART[Size3To2Adapter_v2]:FOLLOWER[Petrus]
{
    @name = MatchingSize1p5to1Adapter
    @module = Part
    @author = PetrusPB
    
    // Physical Attributes
    @title = FL-4D4P Adapter Tank
	@manufacturer = Rockomax
    @description = A compact, aggressively sloped fuel adapter designed to transition structural columns cleanly from a Size 1.5 (1.875m) base down to a Size 1 (1.25m) stack. Perfect for early orbital lifters or providing a tight plumbing bridge on advanced space stations.
    @category = FuelTank
    @subcategory = 0
    @mass *= 0.125
    
    // Crucial Scale Correction
    @rescaleFactor = 0.5
	@node_stack_top = 0.0, 1.15017, 0.0, 0.0, 1.0, 0.0, 1
	@node_stack_bottom = 0.0, -1.1, 0.0, 0.0, -1.0, 0.0, 2
	
    // Scale resources
    @RESOURCE[LiquidFuel]
    {
        @amount = 171
        @maxAmount = 171
        //@amount *= 0.125
        //@maxAmount *= 0.125
    }
    @RESOURCE[Oxidizer]
    {
        @amount = 209
        @maxAmount = 209
        //@amount *= 0.125
        //@maxAmount *= 0.125
    }
}

// Project Petrus - Custom 2.5m to 1.875m Fuel Tank Adapter
+PART[Size3_Size4_Adapter_01]:FOLLOWER[Petrus]
{
    @name = MatchingSize2to1p5Adapter
    @module = Part
    @author = PetrusPB
    
    // Physical Attributes
    @title = Rockomax S2-S1.5 Adapter Tank
	@manufacturer = Rockomax
    @description = A compact, aggressively sloped fuel adapter designed to transition structural columns cleanly from a Size 2 (2.5m) base down to a Size 1.5 (1.875m) stack. Perfect for early orbital lifters or providing a tight plumbing bridge on advanced space stations.
    @category = FuelTank
    @subcategory = 0
    @mass *= 0.125
    
    // Crucial Scale Correction
    @rescaleFactor = 0.5
	@node_stack_top = 0.0, 1.25, 0.0, 0.0, 1.0, 0.0, 2
	@node_stack_bottom = 0.0, -1.25, 0.0, 0.0, -1.0, 0.0, 2
	
    // Scale resources
    @RESOURCE[LiquidFuel]
    {
        @amount *= 0.125
        @maxAmount *= 0.125
    }
    @RESOURCE[Oxidizer]
    {
        @amount *= 0.125
        @maxAmount *= 0.125
    }
}
